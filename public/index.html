<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#064E3B">
  <title>Giftisan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #064E3B;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
    }
    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 320px;
    }
    .logo-badge {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    .logo-badge img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #FFFFFF;
    }
    p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.5;
    }
    .spinner {
      margin-top: 24px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #F59E0B;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }
    .offline-message {
      display: none;
      margin-top: 20px;
      font-size: 13px;
      color: #FDE68A;
      background: rgba(0, 0, 0, 0.25);
      padding: 12px 16px;
      border-radius: 12px;
    }
    .retry-btn {
      display: none;
      margin-top: 16px;
      background-color: #F59E0B;
      color: #064E3B;
      border: none;
      padding: 10px 24px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="brand-container">
    <div class="logo-badge">
      <img src="icon.png" alt="Giftisan" onerror="this.style.display='none'">
    </div>
    <h1>Giftisan</h1>
    <p>Discover unique handcrafted gifts from passionate artisans.</p>
    <div class="spinner" id="spinner"></div>
    <div class="offline-message" id="offline-msg">
      Could not connect to the live store. Please check your internet connection.
    </div>
    <button class="retry-btn" id="retry-btn" onclick="location.reload()">Retry Connection</button>
  </div>

  <script>
    // Automatic redirection to live store if loaded as local fallback
    const targetUrl = 'https://www.giftisan.com';
    
    function navigateToStore() {
      if (navigator.onLine) {
        window.location.href = targetUrl;
      } else {
        showOffline();
      }
    }

    function showOffline() {
      const spinner = document.getElementById('spinner');
      const offlineMsg = document.getElementById('offline-msg');
      const retryBtn = document.getElementById('retry-btn');
      if (spinner) spinner.style.display = 'none';
      if (offlineMsg) offlineMsg.style.display = 'block';
      if (retryBtn) retryBtn.style.display = 'inline-block';
    }

    window.addEventListener('offline', showOffline);
    window.addEventListener('online', () => window.location.href = targetUrl);

    // Timeout if live site takes too long to load
    setTimeout(() => {
      if (window.location.protocol === 'file:' || window.location.hostname === 'localhost') {
        navigateToStore();
      }
    }, 400);

    setTimeout(() => {
      if (window.location.protocol === 'file:' || window.location.hostname === 'localhost') {
        showOffline();
      }
    }, 8000);
  </script>
</body>
</html>
